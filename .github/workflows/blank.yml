name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find QuestMate Android project
        run: |
          echo "Searching for Android project..."

          PROJECT_DIR=$(find . -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find settings.gradle"
            echo "Repository contents:"
            find . -maxdepth 5 -print
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure AndroidX
        run: |
          if [ ! -f "$PROJECT_DIR/gradle.properties" ]; then
            touch "$PROJECT_DIR/gradle.properties"
          fi

          grep -q "android.useAndroidX=true" "$PROJECT_DIR/gradle.properties" || \
            echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"

          grep -q "android.enableJetifier=true" "$PROJECT_DIR/gradle.properties" || \
            echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build QuestMate APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload QuestMate APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestMate-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
