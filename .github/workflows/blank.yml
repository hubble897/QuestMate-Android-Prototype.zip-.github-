name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Android project
        run: |
          echo "Checking QuestMate project..."
          ls -la
          echo "------------------------"

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: Android project files were not found."
            echo "The repository needs the QuestMate Android project."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build QuestMate APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "Looking for APK..."
          find . -name "*.apk" -type f

      - name: Upload QuestMate APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestMate-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
