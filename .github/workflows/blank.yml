name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          echo "Checking for QuestMate ZIP..."
          ls -la
          test -f "QuestMate-Android-Prototype.zip"

      - name: Extract QuestMate
        run: |
          echo "Extracting QuestMate..."
          rm -rf project
          mkdir project
          unzip -o "QuestMate-Android-Prototype.zip" -d project
          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          echo "Looking for Android project..."

          PROJECT_DIR=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts"
            echo "Contents of project:"
            find project -maxdepth 5 -type f
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure AndroidX
        run: |
          echo "Configuring AndroidX..."

          if [ ! -f "$PROJECT_DIR/gradle.properties" ]; then
            touch "$PROJECT_DIR/gradle.properties"
          fi

          if ! grep -q "android.useAndroidX=true" "$PROJECT_DIR/gradle.properties"; then
            echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
          fi

          if ! grep -q "android.enableJetifier=true" "$PROJECT_DIR/gradle.properties"; then
            echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build QuestMate APK
        run: |
          echo "Building QuestMate..."
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find "$PROJECT_DIR" -type f -name "*.apk"

      - name: Upload QuestMate APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestMate-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
