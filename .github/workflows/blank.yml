name: Build QuestMate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate QuestMate project
        run: |
          echo "Repository contents:"
          ls -la

          echo "Searching for Android project..."

          PROJECT_DIR=""

          # If the project is already in the repository
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          fi

          # If QuestMate is a directory
          if [ -z "$PROJECT_DIR" ] && [ -d "QuestMate-Android-Prototype.zip" ]; then
            echo "Found QuestMate folder."
            PROJECT_DIR="QuestMate-Android-Prototype.zip"
          fi

          # If QuestMate is a real ZIP file
          if [ -z "$PROJECT_DIR" ] && [ -f "QuestMate-Android-Prototype.zip" ]; then
            echo "Found QuestMate ZIP."
            rm -rf project
            mkdir project
            unzip -o "QuestMate-Android-Prototype.zip" -d project

            PROJECT_DIR=$(find project -type f \
              -name "settings.gradle" -o -name "settings.gradle.kts" \
              -print -quit | xargs -r dirname)
          fi

          # Search anywhere else in the repository
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . -type f \
              -name "settings.gradle" -o -name "settings.gradle.kts" \
              -not -path "./.git/*" \
              -not -path "./.github/*" \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find the Android project."
            echo ""
            echo "Repository contents:"
            find . -maxdepth 4 -print
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure AndroidX
        run: |
          echo "Configuring AndroidX..."

          if [ ! -f "$PROJECT_DIR/gradle.properties" ]; then
            touch "$PROJECT_DIR/gradle.properties"
          fi

          grep -q "android.useAndroidX=true" "$PROJECT_DIR/gradle.properties" || \
            echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"

          grep -q "android.enableJetifier=true" "$PROJECT_DIR/gradle.properties" || \
            echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle
